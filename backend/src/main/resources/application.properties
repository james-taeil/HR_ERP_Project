spring.application.name=hr-erp
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hr_erp}
spring.datasource.username=${DB_USERNAME:hr_erp}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
app.security.sensitive-key=${SENSITIVE_DATA_KEY:}
app.platform.password.minimum-length=${PLATFORM_PASSWORD_MIN_LENGTH:12}
app.platform.password.history-limit=${PLATFORM_PASSWORD_HISTORY_LIMIT:5}
app.platform.login.max-failed-attempts=${PLATFORM_LOGIN_MAX_FAILED_ATTEMPTS:5}
app.platform.login.lock-duration=${PLATFORM_LOGIN_LOCK_DURATION:PT15M}
app.platform.session.absolute-timeout=${PLATFORM_SESSION_ABSOLUTE_TIMEOUT:PT8H}
app.platform.session.idle-timeout=${PLATFORM_SESSION_IDLE_TIMEOUT:PT30M}
app.platform.session.cookie-name=${PLATFORM_SESSION_COOKIE_NAME:HRERP_SESSION}
