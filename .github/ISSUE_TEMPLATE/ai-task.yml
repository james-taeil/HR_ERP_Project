name: AI 공동 작업 요청
description: 한 번의 요청으로 Cursor 구현과 Codex 검증·통합을 시작합니다.
title: "[AI] "
labels:
  - "agent:pair"
  - "status:ready"
body:
  - type: markdown
    attributes:
      value: |
        이 이슈는 Cursor와 Codex의 공동 작업 큐입니다.
        저장 후 자동 라우터가 Cursor를 호출하고, Codex가 결과를 검증합니다.

  - type: input
    id: ticket
    attributes:
      label: 작업 ID
      description: 기존 tasks.md 또는 업무 ID를 입력하세요.
      placeholder: HR-101
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: 목표
      description: 사용자가 얻어야 하는 결과를 적으세요.
      placeholder: 관리자가 신규 사원의 기본정보를 등록할 수 있어야 한다.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      description: 수정할 도메인, 스펙 또는 기능 범위를 적으세요.
      placeholder: specs/010-인사관리 및 관련 구현
    validations:
      required: true

  - type: input
    id: requirements
    attributes:
      label: 관련 요구사항
      description: 관련 FR·AC가 있으면 쉼표로 구분하세요. 없으면 "신규 정의 필요"라고 적으세요.
      placeholder: FR-010, AC-010
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 성공과 실패를 판정할 수 있는 조건을 적으세요.
      placeholder: |
        - 정상 입력 시 사원이 등록된다.
        - 권한 없는 사용자의 요청은 거부된다.
        - 관련 테스트가 통과한다.
    validations:
      required: true

  - type: textarea
    id: non_goals
    attributes:
      label: 제외 범위
      description: 이번 작업에서 하지 않을 일을 적으세요.
      placeholder: 급여 계산과 4대보험 신고는 포함하지 않는다.
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: 확인
      options:
        - label: AGENTS.md의 스펙 주도 개발 및 브랜치 규칙을 적용합니다.
          required: true
        - label: 제품 결정이 필요한 충돌은 AI가 임의로 정하지 않고 사용자에게 보고합니다.
          required: true
