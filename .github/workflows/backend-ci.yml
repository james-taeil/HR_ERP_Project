name: Backend verification

on:
  workflow_dispatch:
  pull_request:
    branches: [develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: hr_record_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        working-directory: backend
        env:
          HR_RECORD_MYSQL_TEST_URL: jdbc:mysql://127.0.0.1:3306/hr_record_test?useSSL=false&allowPublicKeyRetrieval=true
          HR_RECORD_MYSQL_TEST_USER: root
          HR_RECORD_MYSQL_TEST_PASSWORD: ""
        run: bash gradlew clean test build --stacktrace --info
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/build/test-results/test
            backend/build/reports/tests/test
